    <title>Hameau</title>
    <script>
      // Thème posé avant le premier affichage : sinon la page clignote en
      // sombre puis passe en clair à chaque ouverture.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('hameau.theme') || 'auto';
      } catch (e) {
        document.documentElement.dataset.theme = 'auto';
      }
    </script>
